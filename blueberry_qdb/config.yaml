name: BlueberryQDB
version: "0.1.0"
slug: blueberry_qdb
description: Android USB discovery and runtime App Check bridge for Blueberry MyQ
url: https://git.crit.rip/BlueberryFaygo/BlueberryFaygo
arch: [aarch64, amd64]
startup: services
boot: auto
init: false
usb: true
udev: true
ingress: true
ingress_port: 8091
panel_admin: true
panel_icon: mdi:cellphone-link
ports:
  8091/tcp: null
discovery: [blueberry_q]
hassio_api: true
hassio_role: default
options:
  serial: ""
  adb_targets: []
  poll_seconds: 60
schema:
  serial: str?
  adb_targets: [str]
  poll_seconds: int(15,3600)
